<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Go Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <a href="index.html"><img src="/images/logo.png" alt="Go Learning logo"></a>
            </div>

            <h2>Welcome back</h2>
            
            <form class="auth-form" id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" maxlength="254" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" maxlength="72" autocomplete="new-password" required>
                </div>

                <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
                <button type="submit">Login</button>
            </form>

            <p class="switch-link">
                Don’t have an account? <a href="register.html">Create account</a>
            </p>
        </div>
    </div>
    <script src="auth.js" defer></script>
</body>
</html>
