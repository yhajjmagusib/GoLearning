<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Go Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <img src="/images/logo.png" alt="Go Learning logo">
                <h1>Go Learning</h1>
            </div>

            <h2>Create Account</h2>
            <p class="subtitle">Start learning with us today</p>

            <form class="auth-form" id="register-form" autocomplete="off">
                <div class="input-group">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Your full name" minlength="2" maxlength="160" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="you@example.com" maxlength="254" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" placeholder="Create a password" minlength="8" maxlength="72" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="Enter your password again" minlength="8" maxlength="72" autocomplete="off" required>
                </div>
                <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
                <button type="submit">Register</button>
            </form>

            <p class="switch-link">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>
    <script src="api-config.js"></script>
    <script src="auth.js" defer></script>
</body>
</html>
